<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[TITLE]]</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Karla:wght@400;500;700&display=swap">

<body style="margin:0; padding:0; background:#F7F2E9;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F2E9;">

      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px; background:#FDFBF7; border-radius:20px; overflow:hidden;">
          <tr>
            <td align="center" style="padding: 40px 36px 0;">
              <img src="[[LOGO_URL]]" width="64" height="64" alt="Morgonlistan" style="display:block; width:64px; height:64px; border:0; border-radius:16px;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 24px 36px 8px;">
              <h1 style="margin:0 0 14px; font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:26px; line-height:1.25; color:#2B2A28;">
                [[TITLE]]
              </h1>
              <p style="margin:0 0 20px; font-family:'Karla',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.6; color:#55504A;">
                [[BODY]]
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 0 36px;">
              [[ACTION]]
            </td>
          </tr>
          [[EXTRA]]
          <tr>
            <td align="center" style="padding: 28px 36px 36px;">
              <p style="margin:0; font-family:'Karla',Helvetica,Arial,sans-serif; font-size:13px; line-height:1.6; color:#9C9587;">
                [[FOOTNOTE]]
              </p>

          </tr>
        </table>
        <p style="margin:20px 0 0; font-family:'Karla',Helvetica,Arial,sans-serif; font-size:12px; color:#ADB5BD;">
          Morgonlistan &middot; morninglist.app
        </p>
      </td>
    </tr>
  </table>

</html>
